  test-happy-multi:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branches:
        # single upgrade
        - "9.6,14-official-initial"
        - "9.6,14-official-last"
        - "9.6,17"
        - "9.6,18"

        - "14-official-initial,14-official-last"
        - "14-official-initial,17"
        - "14-official-initial,18"

        - "14-official-last,17"
        - "14-official-last,18"

        - "17,18"

        # two upgrades
        - "9.6,14-official-initial,14-official-last"
        - "9.6,14-official-initial,17"
        - "9.6,14-official-initial,18"

        - "9.6,14-official-last,17"
        - "9.6,14-official-last,18"

        - "9.6,17,18"

        - "14-official-initial,14-official-last,17"
        - "14-official-initial,14-official-last,18"

        - "14-official-initial,17,18"

        - "14-official-last,17,18"

        # three upgrades
        - "9.6,14-official-initial,14-official-last,17"
        - "9.6,14-official-initial,14-official-last,18"
        - "9.6,14-official-initial,17,18"
        - "9.6,14-official-last,17,18"

        - "14-official-initial,14-official-last,17,18"

        # four upgrades
        - "9.6,14-official-initial,14-official-last,17,18"

        restartAfterUpgrade:
        - true
        - false
    steps:
      - uses: actions/checkout@v6
      - run: RESTART_AFTER_UPGRADE=${{ matrix.restartAfterUpgrade }} BRANCHES="$(sed -E -e 's/(^|,)/\1upgrade-pg-/g' <<<'${{ matrix.branches }}')" ./test-multi-upgrade_ok --force
      - name: service logs
        if: always()
        continue-on-error: true
        run: ./get-service-logs service
      - name: postgres logs
        if: always()
        continue-on-error: true
        run: ./get-service-logs postgres
      - name: postgres14 logs
        if: always()
        continue-on-error: true
        run: ./get-service-logs postgres14
      - run: ./docker-volumes/catch-orphans
        if: always()
