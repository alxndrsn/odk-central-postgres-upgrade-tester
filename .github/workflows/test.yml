---
name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6
      - run: ./shellcheck
  test-new-install-postgres14-first:
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        targetBranch:
        - "upgrade-pg-17"
        - "upgrade-pg-18"
    steps:
      - uses: actions/checkout@v6
      - run: ./set-docker-buildx-config
      - run: INITIAL_BRANCH=${{ matrix.targetBranch }} TARGET_BRANCH=${{ matrix.targetBranch }} ./test-new-install-postgres14-first --force
      - name: service logs
        if: always()
        continue-on-error: true
        run: ./get-service-logs service
      - name: postgres logs
        if: always()
        continue-on-error: true
        run: ./get-service-logs postgres
      - name: postgres14 logs
        if: always()
        continue-on-error: true
        run: ./get-service-logs postgres14
      - run: ./docker-volumes/catch-orphans
        if: always()
