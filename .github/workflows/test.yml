---
name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6
      - run: ./shellcheck
  test-new-install:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - run: ./set-docker-buildx-config
      - name: test upgrade (happy path)
        shell: bash
        run: ./test-new-install --force
      - uses: ./.github/actions/print-container-logs
  test-happy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - run: ./set-docker-buildx-config
      - name: test upgrade (happy path)
        shell: bash
        run: ./test-upgrade_ok --force
      - uses: ./.github/actions/print-container-logs
  test-no-space-destination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: ./set-docker-buildx-config
      - name: test upgrade (no space left on target device)
        shell: bash
        run: ./test-upgrade_no-space-destination --force
      - uses: ./.github/actions/print-container-logs
  test-docker-build-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: ./set-docker-buildx-config
      - name: test upgrade (docker build failure)
        shell: bash
        run: ./test-upgrade_docker-build-failure --force
      - uses: ./.github/actions/print-container-logs
